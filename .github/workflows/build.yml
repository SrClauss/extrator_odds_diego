name: Build Extrator de Odds

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install beautifulsoup4 openpyxl selenium webdriver-manager
        pip install pyinstaller pyarmor
      shell: pwsh

    - name: Ofuscar código com PyArmor
      run: |
        pyarmor gen -O dist-obf extract_odds.py
      shell: pwsh
      continue-on-error: true

    - name: Build com PyInstaller (código ofuscado)
      if: success()
      run: |
        if (Test-Path "dist-obf/extract_odds.py") {
          pyinstaller --onefile --name "ExtractOdds" --hidden-import=selenium --hidden-import=webdriver_manager --hidden-import=bs4 --hidden-import=openpyxl dist-obf/extract_odds.py
        } else {
          Write-Host "Arquivo ofuscado nao encontrado, usando original"
          exit 1
        }
      shell: pwsh
      continue-on-error: true

    - name: Build com PyInstaller (fallback - código original)
      if: failure()
      run: |
        pyinstaller --onefile --name "ExtractOdds" --hidden-import=selenium --hidden-import=webdriver_manager --hidden-import=bs4 --hidden-import=openpyxl extract_odds.py
      shell: pwsh

    - name: Copiar arquivos auxiliares
      run: |
        if (Test-Path "dist/ExtractOdds.exe") {
          Copy-Item run_extract_odds.bat dist/ -ErrorAction SilentlyContinue
          Copy-Item run_quick.bat dist/ -ErrorAction SilentlyContinue
          Copy-Item requirements_minimo.txt dist/requirements.txt -ErrorAction SilentlyContinue
          Copy-Item README.md dist/ -ErrorAction SilentlyContinue
          Write-Host "Arquivos copiados com sucesso"
        } else {
          Write-Host "Executavel nao encontrado!"
          exit 1
        }
      shell: pwsh

    - name: Criar pacote de distribuição
      run: |
        Compress-Archive -Path dist/* -DestinationPath ExtractOdds-Windows.zip -Force
        Write-Host "Pacote criado com sucesso"
      shell: pwsh

    - name: Upload do executável
      uses: actions/upload-artifact@v4
      with:
        name: ExtractOdds-Windows
        path: ExtractOdds-Windows.zip
        retention-days: 90

    - name: Upload para Release (se tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: ExtractOdds-Windows.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
